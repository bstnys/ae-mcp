<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AE Arcade</title>
  <style>
    html, body { margin: 0; height: 100%; background: #232323; color: #d6d6d6; overflow: hidden;
      font: 12px -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; user-select: none; }
    #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
      padding: 16px; box-sizing: border-box; gap: 14px; outline: none; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .14em; color: #fff; }
    #games { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .game { flex: 1 1 130px; max-width: 200px; background: #1b1b1b; border: 1px solid #333; border-radius: 8px;
      padding: 12px; cursor: pointer; text-align: left; color: inherit; font: inherit; display: flex; flex-direction: column; gap: 8px; }
    .game:hover { background: #222; border-color: #555; }
    .game.sel { border-color: #2d8ceb; box-shadow: 0 0 0 1px #2d8ceb inset; }
    .game canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 4px; background: #161616; display: block; }
    .name { font-size: 15px; font-weight: 600; color: #fff; }
    .meta { display: flex; justify-content: space-between; color: #8a8a8a; font-size: 11px; }
    .meta b { color: #ddd; font: 600 12px Menlo, Consolas, monospace; }
    #hint { color: #777; font-size: 11px; text-align: center; }
    #hint b { color: #aaa; font-weight: 500; }
  </style>
</head>
<body>
  <div id="wrap" tabindex="0">
    <h1>AE ARCADE</h1>
    <div id="games">
      <button class="game" data-game="tetris" type="button">
        <canvas id="pvTetris" width="240" height="180"></canvas>
        <span class="name">1 · 테트리스</span>
        <span class="meta"><span>최고 점수</span><b id="bestTetris">0</b></span>
      </button>
      <button class="game" data-game="breakout" type="button">
        <canvas id="pvBreakout" width="240" height="180"></canvas>
        <span class="name">2 · 벽돌깨기</span>
        <span class="meta"><span>최고 점수</span><b id="bestBreakout">0</b></span>
      </button>
      <button class="game" data-game="gomoku" type="button">
        <canvas id="pvGomoku" width="240" height="180"></canvas>
        <span class="name">3 · 오목</span>
        <span class="meta"><span>AI 상대</span><b id="levelGomoku">보통</b></span>
      </button>
      <button class="game" data-game="chess" type="button">
        <canvas id="pvChess" width="240" height="180"></canvas>
        <span class="name">4 · 체스</span>
        <span class="meta"><span>AI 상대</span><b id="levelChess">보통</b></span>
      </button>
    </div>
    <div id="hint"><b>← →</b> 고르기 · <b>Enter</b> 시작 · <b>1~4</b> 바로 시작<br>게임 중에는 <b>M</b>으로 이 화면에 돌아와요</div>
  </div>
  <script src="js/arcade.js"></script>
  <script>
  (function () {
    var cards = [].slice.call(document.querySelectorAll('.game'));
    var last = 'tetris';
    try { last = localStorage.getItem('aeArcadeLast') || 'tetris'; } catch (e) { /* storage unavailable */ }
    var sel = Math.max(0, cards.findIndex(function (c) { return c.dataset.game === last; }));

    function select(i) {
      sel = (i + cards.length) % cards.length;
      cards.forEach(function (c, j) { c.classList.toggle('sel', j === sel); });
    }
    cards.forEach(function (c, i) {
      c.addEventListener('click', function () { Arcade.open(c.dataset.game); });
      c.addEventListener('mouseenter', function () { select(i); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') select(sel - 1);
      else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') select(sel + 1);
      else if (e.code === 'Enter' || e.code === 'Space') Arcade.open(cards[sel].dataset.game);
      else if (e.code === 'Digit1') Arcade.open('tetris');
      else if (e.code === 'Digit2') Arcade.open('breakout');
      else if (e.code === 'Digit3') Arcade.open('gomoku');
      else if (e.code === 'Digit4') Arcade.open('chess');
      else return;
      e.preventDefault();
    });
    select(sel);
    document.getElementById('bestTetris').textContent = Arcade.load('aeTetrisBest').toLocaleString();
    document.getElementById('bestBreakout').textContent = Arcade.load('aeBreakoutBest').toLocaleString();

    // Little static previews of each game.
    function cell(c, x, y, s, color) {
      c.fillStyle = color; c.fillRect(x + 1, y + 1, s - 2, s - 2);
      c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(x + 1, y + 1, s - 2, 3);
    }
    var t = document.getElementById('pvTetris').getContext('2d');
    var rows = ['..........', '....TT....', '.....T....', '..........', '..........', 'Z........I', 'ZZ.LL....I', 'SZLLOO.JJI', 'SSIIIIOOJI', 'SJJTTTOOJL'];
    var cols = { I: '#3fc6d9', J: '#4a6fe0', L: '#e8933a', O: '#e6c84a', S: '#5cc469', T: '#a35ad6', Z: '#e05252' };
    rows.forEach(function (r, y) { r.split('').forEach(function (ch, x) { if (cols[ch]) cell(t, 30 + x * 18, y * 18, 18, cols[ch]); }); });
    var b = document.getElementById('pvBreakout').getContext('2d');
    var rc = ['#e05252', '#e8933a', '#e6c84a', '#5cc469', '#3fc6d9'];
    for (var r = 0; r < 5; r++) for (var c = 0; c < 8; c++) {
      if ((r === 3 && c === 2) || (r === 4 && (c === 2 || c === 3 || c === 6))) continue;
      b.fillStyle = rc[r]; b.fillRect(12 + c * 27, 18 + r * 13, 24, 10);
    }
    b.fillStyle = '#ddd'; b.fillRect(100, 160, 50, 7);
    b.fillStyle = '#fff'; b.beginPath(); b.arc(138, 120, 5, 0, Math.PI * 2); b.fill();

    var LV = { easy: '쉬움', normal: '보통', hard: '어려움' };
    document.getElementById('levelGomoku').textContent = LV[Arcade.loadText('aeGomokuLevel', 'normal')];
    document.getElementById('levelChess').textContent = LV[Arcade.loadText('aeChessLevel', 'normal')];

    var o = document.getElementById('pvGomoku').getContext('2d');
    o.fillStyle = '#d4a85f'; o.fillRect(30, 0, 180, 180);
    o.strokeStyle = 'rgba(60,40,15,.7)';
    for (var i = 0; i < 9; i++) {
      o.beginPath(); o.moveTo(40, 10 + i * 20 + .5); o.lineTo(200, 10 + i * 20 + .5); o.stroke();
      o.beginPath(); o.moveTo(40 + i * 20 + .5, 10); o.lineTo(40 + i * 20 + .5, 170); o.stroke();
    }
    [[4, 4, 1], [3, 5, 2], [5, 3, 1], [3, 3, 2], [6, 2, 1], [4, 5, 2], [2, 6, 1], [5, 5, 2], [3, 4, 1]].forEach(function (s) {
      o.fillStyle = s[2] === 1 ? '#151515' : '#f2f2f2';
      o.beginPath(); o.arc(40 + s[0] * 20, 10 + s[1] * 20, 8.5, 0, Math.PI * 2); o.fill();
    });

    var ch = document.getElementById('pvChess').getContext('2d');
    for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
      ch.fillStyle = (x + y) % 2 ? '#7a8c9e' : '#d6dde4'; ch.fillRect(48 + x * 18, 18 + y * 18, 18, 18);
    }
    ch.font = '16px "Apple Symbols", "Segoe UI Symbol", serif'; ch.textAlign = 'center'; ch.textBaseline = 'middle';
    [['♜', 0, 0, 0], ['♚', 6, 0, 0], ['♟', 5, 1, 0], ['♟', 6, 1, 0], ['♞', 2, 2, 0], ['♛', 3, 4, 1], ['♝', 2, 4, 1],
     ['♟', 4, 4, 1], ['♟', 3, 6, 1], ['♚', 4, 7, 1], ['♜', 7, 7, 1]].forEach(function (p) {
      ch.fillStyle = p[3] ? '#fafafa' : '#1d1d1d'; ch.strokeStyle = '#222';
      ch.strokeText(p[0], 57 + p[1] * 18, 28 + p[2] * 18); ch.fillText(p[0], 57 + p[1] * 18, 28 + p[2] * 18);
    });
  })();
  </script>
</body>
</html>
