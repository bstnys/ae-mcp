<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AE Tetris</title>
  <style>
    /* --u is the UI scale. ui.js sets it from the panel size so every box, font and preview
       grows and shrinks with the board. */
    :root { --u: 1; }
    html, body { margin: 0; height: 100%; background: #232323; color: #d6d6d6; overflow: hidden;
      font: calc(12px * var(--u)) -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; user-select: none; }
    #wrap { display: grid; height: 100%; padding: 10px; box-sizing: border-box; gap: calc(8px * var(--u)) calc(10px * var(--u));
      justify-content: center; align-content: center; outline: none; }
    #left, #side { display: contents; }
    /* Wide panel: Hold left of the board, the rest stacked on the right. */
    #wrap.cols { grid-template-columns: calc(84px * var(--u)) auto calc(84px * var(--u));
      grid-template-rows: auto auto auto auto minmax(0, 1fr);
      grid-template-areas: "hold board next" ". board score" ". board stats" ". board best" ". board keys"; }
    /* Tall narrow panel: Hold and Next above the board, the numbers below it. */
    #wrap.rows { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: auto auto auto;
      grid-template-areas: "hold hold next next next next" "board board board board board board" "score score stats stats best best"; }
    #wrap.rows #keys { display: none; }
    #holdBox { grid-area: hold; } #nextBox { grid-area: next; } #scoreBox { grid-area: score; }
    #statsBox { grid-area: stats; } #bestBox { grid-area: best; } #keys { grid-area: keys; }
    #boardBox { grid-area: board; position: relative; align-self: start; }
    #board { display: block; background: #161616; border: 1px solid #3a3a3a; border-radius: 4px; }
    .stats { display: flex; gap: calc(8px * var(--u)); }
    .stats > div { flex: 1; min-width: 0; }
    #wrap > * > .box { align-self: start; }
    .box { background: #1b1b1b; border: 1px solid #333; border-radius: 4px; padding: calc(6px * var(--u)); min-width: 0; }
    .label { font-size: calc(10px * var(--u)); letter-spacing: .08em; color: #8a8a8a; text-transform: uppercase; margin-bottom: calc(4px * var(--u)); }
    .value { font: 600 calc(16px * var(--u)) Menlo, Consolas, monospace; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    canvas.mini { display: block; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(18,18,18,.82); text-align: center; gap: calc(8px * var(--u)); border-radius: 4px; }
    #overlay.hidden { display: none; }
    #overlay h1 { margin: 0; font-size: calc(22px * var(--u)); color: #fff; letter-spacing: .06em; }
    #overlay p { margin: 0; color: #aaa; line-height: 1.6; }
    button { background: #2d8ceb; color: #fff; border: 0; border-radius: 5px; padding: calc(6px * var(--u)) calc(16px * var(--u));
      font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #3a97f0; }
    button.ghost { background: transparent; color: #aaa; font-weight: 500; }
    button.ghost:hover { color: #fff; background: rgba(255,255,255,.06); }
    #keys { font-size: calc(10px * var(--u)); color: #777; line-height: 1.7; align-self: end; overflow: hidden; min-height: 0; }
    #keys.clipped { display: none; }
    #keys b { color: #aaa; font-weight: 500; }
    #focusHint { color: #e0b252; font-size: calc(11px * var(--u)); }
  </style>
</head>
<body>
  <div id="wrap" class="cols" tabindex="0">
    <div id="left">
      <div class="box" id="holdBox"><div class="label">Hold</div><canvas id="hold" class="mini"></canvas></div>
    </div>
    <div id="boardBox">
      <canvas id="board"></canvas>
      <div id="overlay">
        <h1 id="ovTitle">AE TETRIS</h1>
        <p id="ovText">패널을 클릭한 뒤<br>Enter 또는 버튼으로 시작</p>
        <button id="startBtn" type="button">시작</button>
        <button id="menuBtn" class="ghost" type="button">게임 선택 (M)</button>
      </div>
    </div>
    <div id="side">
      <div class="box" id="nextBox"><div class="label">Next</div><canvas id="next" class="mini"></canvas></div>
      <div class="box" id="scoreBox"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="box stats" id="statsBox">
        <div><div class="label">Lines</div><div class="value" id="lines">0</div></div>
        <div><div class="label">Level</div><div class="value" id="level">1</div></div>
      </div>
      <div class="box" id="bestBox"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div id="keys">
        <b>← →</b> 이동<br><b>↓</b> 소프트 드롭<br><b>Space</b> 하드 드롭<br>
        <b>↑ / X</b> 회전 · <b>Z</b> 반대<br><b>C / Shift</b> 홀드<br><b>P / Esc</b> 일시정지<br><b>R</b> 재시작 · <b>M</b> 게임 선택
        <div id="focusHint"></div>
      </div>
    </div>
  </div>
  <script src="js/arcade.js"></script>
  <script src="js/tetris.js"></script>
  <script src="js/tetris-ui.js"></script>
</body>
</html>
