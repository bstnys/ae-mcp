<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AE Tic-tac-toe</title>
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <div id="wrap" tabindex="0">
    <div id="boardBox"><canvas id="board"></canvas></div>
    <div id="side">
      <div class="title">틱택토</div>
      <div id="status" class="status">내 차례</div>
      <div class="row">
        <label>난이도 <select id="level"><option value="easy">쉬움</option><option value="normal">보통</option><option value="hard">어려움</option></select></label>
        <label>내 표시 <select id="color"><option value="X">X (선)</option><option value="O">O</option></select></label>
      </div>
      <div class="row">
        <button id="newBtn" type="button">새 게임 (N)</button>
        <button id="undoBtn" class="ghost" type="button">무르기 (U)</button>
      </div>
      <div class="info" id="tally">나 0 · AI 0 · 무승부 0</div>
      <div class="info">숫자키 1~9로도 둘 수 있어요 (키패드 배치).<br>어려움은 절대 지지 않아요.</div>
      <div class="row foot"><button id="menuBtn" class="ghost" type="button">← 게임 선택 (M)</button></div>
    </div>
  </div>
  <script src="js/arcade.js"></script>
  <script src="js/tictactoe.js"></script>
  <script src="js/tictactoe-ui.js"></script>
</body>
</html>
