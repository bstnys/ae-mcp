<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AE 2048</title>
  <style>
    html, body { margin: 0; height: 100%; background: #232323; color: #d6d6d6; overflow: hidden;
      font: 12px -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; user-select: none; }
    #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
      padding: 10px; box-sizing: border-box; gap: 8px; outline: none; }
    #top { display: flex; gap: 6px; align-items: stretch; }
    .box { flex: 1; background: #1b1b1b; border: 1px solid #333; border-radius: 4px; padding: 4px 8px; min-width: 0; }
    .label { font-size: 10px; letter-spacing: .08em; color: #8a8a8a; text-transform: uppercase; }
    .value { font: 600 16px Menlo, Consolas, monospace; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #boardBox { position: relative; }
    #board { display: block; border-radius: 6px; touch-action: none; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      background: rgba(18,18,18,.78); border-radius: 6px; text-align: center; }
    #overlay.hidden { display: none; }
    #overlay h1 { margin: 0; font-size: 24px; color: #fff; }
    #overlay p { margin: 0; color: #aaa; }
    button { background: #2d8ceb; color: #fff; border: 0; border-radius: 5px; padding: 5px 12px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #3a97f0; }
    button.ghost { background: #2c2c2c; color: #bbb; font-weight: 500; }
    button.ghost:hover { color: #fff; background: #383838; }
    button:disabled { opacity: .45; cursor: default; }
    #bar { display: flex; gap: 6px; align-items: center; }
    #keys { font-size: 10px; color: #777; text-align: center; }
    #keys b { color: #aaa; font-weight: 500; }
  </style>
</head>
<body>
  <div id="wrap" tabindex="0">
    <div id="top">
      <div class="box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="box"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div id="boardBox">
      <canvas id="board"></canvas>
      <div id="overlay" class="hidden">
        <h1 id="ovTitle">2048!</h1>
        <p id="ovText"></p>
        <button id="ovBtn" type="button">계속하기</button>
      </div>
    </div>
    <div id="bar">
      <button id="newBtn" type="button">새 게임 (N)</button>
      <button id="undoBtn" class="ghost" type="button">한 수 무르기 (U)</button>
      <button id="menuBtn" class="ghost" type="button">← 게임 선택 (M)</button>
    </div>
    <div id="keys"><b>방향키 / WASD</b> 또는 판을 <b>드래그</b>해서 밀기</div>
  </div>
  <script src="js/arcade.js"></script>
  <script src="js/g2048.js"></script>
  <script src="js/g2048-ui.js"></script>
</body>
</html>
