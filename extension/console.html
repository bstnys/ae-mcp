<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Console</title>
  <style>
    :root { --bg: #1c1c1c; --field: #141414; --line: #353535; --text: #e6e6e6; --dim: #8a8a8a; --accent: #d97757; --ok: #5cb85c; --err: #e06c6c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px -apple-system, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif; }

    /* Spotlight-style command line on top */
    form { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .glyph { color: var(--accent); font-size: 18px; line-height: 26px; }
    textarea { flex: 1; resize: none; max-height: 140px; background: transparent; color: var(--text); border: 0; outline: none; padding: 3px 0; font: 17px -apple-system, "Apple SD Gothic Neo", sans-serif; line-height: 22px; }
    textarea::placeholder { color: #666; }
    .spinner { display: none; margin-top: 6px; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    body.busy .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #log { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .msg { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .msg.user { color: #fff; font-weight: 600; }
    .msg.user::before { content: "› "; color: var(--accent); }
    .msg.tool { font: 11px Menlo, monospace; color: var(--dim); margin-bottom: 4px; }
    .msg.tool .st { display: inline-block; width: 14px; }
    .msg.tool.ok .st { color: var(--ok); }
    .msg.tool.err { color: var(--err); }
    .msg.error { color: var(--err); }
    .empty { color: var(--dim); text-align: center; margin-top: 12%; line-height: 1.8; }

    footer { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
    footer small { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; font: inherit; cursor: pointer; }
    button:hover { color: var(--text); border-color: #555; }
    kbd { font: 11px Menlo, monospace; color: var(--text); }

    /* Shortcut recorder */
    #shortcut { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
    #shortcut.open { display: flex; }
    .card { width: 300px; background: #262626; border: 1px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; }
    .card h3 { margin: 0 0 6px; font-size: 13px; }
    .card p { margin: 0 0 12px; color: var(--dim); font-size: 12px; line-height: 1.5; }
    #recorder { display: block; width: 100%; padding: 12px; margin-bottom: 12px; border: 1px dashed var(--accent); border-radius: 8px; font: 20px Menlo, monospace; color: var(--text); outline: none; }
    #recorder:focus { background: #1e1e1e; }
    .row { display: flex; gap: 8px; justify-content: center; }
    #save { background: var(--accent); border-color: var(--accent); color: #fff; }
    #save:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <form id="form">
    <span class="glyph">✱</span>
    <textarea id="input" rows="1" placeholder="After Effects에서 할 일을 입력하세요" autofocus></textarea>
    <span class="spinner"></span>
  </form>
  <div id="log"></div>
  <footer>
    <small id="status"></small>
    <button id="keys" type="button" title="콘솔을 여는 단축키 바꾸기">단축키 <kbd id="keysLabel">없음</kbd></button>
    <button id="reset" type="button" title="새 대화 (⌘N)">새 대화</button>
  </footer>

  <div id="shortcut">
    <div class="card">
      <h3>콘솔 단축키</h3>
      <p>원하는 키 조합을 누르세요.<br>⌘, ⌃, ⌥ 중 하나 이상이 들어가야 해요.</p>
      <div id="recorder" tabindex="0">…</div>
      <p id="recorderNote"></p>
      <div class="row">
        <button id="cancel" type="button">취소</button>
        <button id="clear" type="button">지우기</button>
        <button id="save" type="button" disabled>저장</button>
      </div>
    </div>
  </div>

  <script>
    window.onerror = function (msg, src, line) {
      var d = document.createElement('div');
      d.className = 'msg error';
      d.textContent = '콘솔 오류: ' + msg + (line ? ' (line ' + line + ')' : '');
      document.getElementById('log').appendChild(d);
    };
  </script>
  <script src="js/claude-runner.js"></script>
  <script src="js/shortcut.js"></script>
  <script src="js/console.js"></script>
</body>
</html>
