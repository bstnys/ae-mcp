<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Console</title>
  <style>
    :root { --bg: #1e1e1e; --panel: #262626; --line: #3a3a3a; --text: #e2e2e2; --dim: #8c8c8c; --accent: #d97757; --ok: #5cb85c; --err: #e06c6c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px -apple-system, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    header strong { color: var(--accent); }
    header small { color: var(--dim); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { color: var(--text); border-color: #555; }
    #log { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .msg { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .msg.user { color: #fff; font-weight: 600; }
    .msg.user::before { content: "› "; color: var(--accent); }
    .msg.tool { font: 11px Menlo, monospace; color: var(--dim); margin-bottom: 4px; }
    .msg.tool .st { display: inline-block; width: 14px; }
    .msg.tool.ok .st { color: var(--ok); }
    .msg.tool.err { color: var(--err); }
    .msg.error { color: var(--err); }
    .msg.meta { color: var(--dim); font-size: 11px; }
    .empty { color: var(--dim); text-align: center; margin-top: 18%; line-height: 1.7; }
    form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
    textarea { flex: 1; resize: none; max-height: 120px; background: #161616; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; outline: none; }
    textarea:focus { border-color: var(--accent); }
    #send { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px 12px; }
    #send.stop { background: transparent; color: var(--err); border-color: var(--err); }
    .spinner { display: none; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    body.busy .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <strong>Claude</strong><span class="spinner"></span><small id="status"></small>
    <button id="reset" type="button" title="새 대화 (⌘N)">새 대화</button>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="After Effects에서 할 일을 입력하세요" autofocus></textarea>
    <button id="send" type="submit">보내기</button>
  </form>
  <script>
    window.onerror = function (msg, src, line) {
      var d = document.createElement('div');
      d.className = 'msg error';
      d.textContent = '콘솔 오류: ' + msg + (line ? ' (line ' + line + ')' : '');
      document.getElementById('log').appendChild(d);
    };
  </script>
  <script src="js/claude-runner.js"></script>
  <script src="js/console.js"></script>
</body>
</html>
